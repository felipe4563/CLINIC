services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: novaged
      MYSQL_USER: novaged
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me}
    volumes:
      - mysql_data:/var/lib/mysql
    # Sin "ports": mysql solo es alcanzable desde otros contenedores de esta
    # red (por ejemplo "api"). Para depurar desde el VPS usa:
    #   docker compose exec mysql mysql -u novaged -p novaged

  # Las imágenes las construye GitHub Actions (.github/workflows/imagenes.yml)
  # y deploy.sh exporta TAG con el SHA del commit actual. Sin TAG se usa
  # "latest". "build:" queda para construir a mano si hiciera falta:
  #   docker compose build api
  api:
    image: ghcr.io/felipe4563/clinic-api:${TAG:-latest}
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      - mysql
    volumes:
      - uploads_data:/app/uploads
      # Comprobantes y justificaciones: privados, nunca bajo /uploads.
      - privado_data:/app/privado
    ports:
      # El nginx del sistema (fuera de Docker) reenvia aqui. Atado a
      # 127.0.0.1: nadie desde internet puede llegar directo a este puerto,
      # solo procesos del propio VPS.
      - "127.0.0.1:4010:4000"

  public-site:
    image: ghcr.io/felipe4563/clinic-public-site:${TAG:-latest}
    build: ./public-site
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3101:3000"

  staff:
    image: ghcr.io/felipe4563/clinic-staff:${TAG:-latest}
    build: ./staff
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3102:3000"

volumes:
  mysql_data:
  uploads_data:
  privado_data:
