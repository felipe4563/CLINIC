services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: novaged
      MYSQL_USER: novaged
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me}
    volumes:
      - mysql_data:/var/lib/mysql
    # Sin "ports": mysql solo es alcanzable desde otros contenedores de esta
    # red (por ejemplo "api"). Para depurar desde el VPS usa:
    #   docker compose exec mysql mysql -u novaged -p novaged

  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      - mysql
    volumes:
      - uploads_data:/app/uploads
    # Sin "ports": nginx llega a la API por la red interna (http://api:4000).
    # No se expone directamente a internet.

  public-site:
    build: ./public-site
    restart: unless-stopped
    depends_on:
      - api
    # Sin "ports": solo nginx llega a este servicio (http://public-site:3000).

  staff:
    build: ./staff
    restart: unless-stopped
    depends_on:
      - api
    # Sin "ports": solo nginx llega a este servicio (http://staff:3000).

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api
      - public-site
      - staff
    ports:
      - "80:80"
      - "443:443"

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;"

volumes:
  mysql_data:
  uploads_data:
  certbot_conf:
  certbot_www:
