# Configuracion temporal (solo HTTP), usada UNICAMENTE para el primer
# despliegue, antes de que existan los certificados de Let's Encrypt.
# Ver DEPLOY.md. Una vez emitidos los certificados, se reemplaza por
# nginx.conf (que ya incluye los server blocks HTTPS).

server {
    listen 80;
    server_name clinicnovaged.rusoft.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://api:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://public-site:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
