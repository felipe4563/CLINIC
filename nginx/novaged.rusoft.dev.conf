# Sistema interno (staff) de Clinic NovagED.
#
# Este archivo va en el nginx DEL SISTEMA del VPS (no en Docker), junto a
# tus otros sitios (agro.rusoft.dev, hyh.rusoft.dev, etc.):
#
#   sudo cp nginx/novaged.rusoft.dev.conf /etc/nginx/sites-available/novaged.rusoft.dev
#   sudo ln -s /etc/nginx/sites-available/novaged.rusoft.dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d novaged.rusoft.dev
#
# certbot reescribe este archivo automaticamente para agregar el bloque
# HTTPS (443) y el redirect 80->443 — no hace falta escribirlo a mano.

server {
    listen 80;
    server_name novaged.rusoft.dev;

    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://127.0.0.1:4010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3102/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
