# Configuracion final (HTTPS). Requiere que los certificados de Let's Encrypt
# ya existan en el volumen certbot_conf para ambos dominios.
# Ver DEPLOY.md para el procedimiento de primer despliegue (bootstrap con
# nginx.bootstrap.conf antes de usar este archivo).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- clinicnovaged.rusoft.dev (sitio publico) ---------------------------
server {
    listen 80;
    server_name clinicnovaged.rusoft.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name clinicnovaged.rusoft.dev;

    ssl_certificate     /etc/letsencrypt/live/clinicnovaged.rusoft.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinicnovaged.rusoft.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://api:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://public-site:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- novaged.rusoft.dev (sistema interno / staff) ------------------------
