server {
    listen 80;
    server_name clinicnovaged.com www.clinicnovaged.com;

    location /api/ {
        proxy_pass http://api:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://public-site:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# NOTE: confirm the real subdomain for "el sistema" with the user before
# production deploy — placeholder used here per the Fase 2 spec.
server {
    # default_server: preserves pre-branch catch-all behavior — before the
    # server block split, unmatched hosts (raw IP, localhost, etc.) reached
    # this pre-existing Fase 1 system, and must continue to do so.
    listen 80 default_server;
    server_name portal.clinicnovaged.com;

    location /api/ {
        proxy_pass http://api:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://web:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
