# Construye las imágenes Docker del sistema y las publica en ghcr.io.
#
# Corre con cada push a main. El VPS ya no construye nada: deploy.sh solo
# descarga la imagen del commit que acaba de traer con git pull.
#
# Cada imagen se etiqueta con el SHA completo del commit (la que usa
# deploy.sh) y con "latest". Para volver a una versión anterior en el VPS:
#   TAG=<sha> docker compose up -d
name: Imágenes Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Si se hacen dos push seguidos, el build del primero se cancela.
concurrency:
  group: imagenes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - servicio: api
            contexto: ./backend
          - servicio: staff
            contexto: ./staff
          - servicio: public-site
            contexto: ./public-site
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          push: true
          tags: |
            ghcr.io/felipe4563/clinic-${{ matrix.servicio }}:${{ github.sha }}
            ghcr.io/felipe4563/clinic-${{ matrix.servicio }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}
